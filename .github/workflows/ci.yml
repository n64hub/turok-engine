# The engine has no build of its own: the games that hold it are what test it. Each game's CI, called with engine-ref,
# checks out that game's main, puts lib/turok-engine at this commit and runs its own Windows and Linux builds
# (everything but the ROM-generated sources, no link). A change that needs a game's change too goes red here until that
# change is on the game's main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  t2:
    uses: n64hub/turok-2-recomp/.github/workflows/ci.yml@main
    with:
      engine-ref: ${{ github.sha }}
  t3:
    uses: n64hub/turok-3-recomp/.github/workflows/ci.yml@main
    with:
      engine-ref: ${{ github.sha }}
  t1:
    uses: n64hub/turok-recomp/.github/workflows/ci.yml@main
    with:
      engine-ref: ${{ github.sha }}
  # tools/submodules.sh on Linux: a game's submodules from an empty cache, then a second checkout from the full one,
  # which must download nothing.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fill two checkouts
        env:
          TUROK_GIT_CACHE: ${{ runner.temp }}/cache
        run: |
          for c in a b; do
            git clone -q https://github.com/n64hub/turok-recomp "$RUNNER_TEMP/$c"
            bash tools/submodules.sh "$RUNNER_TEMP/$c" 2>&1 | tee "$RUNNER_TEMP/$c.log"
            if git -C "$RUNNER_TEMP/$c" submodule status --recursive | grep -v "^ "; then exit 1; fi   # each checked out
          done
          if grep -E "caching|fetching" "$RUNNER_TEMP/b.log"; then exit 1; fi   # the second downloads nothing
